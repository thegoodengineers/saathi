[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saathi"
version = "0.1.0"
description = "Say it in your language; Saathi does the web task for you, and stops before anything risky."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["playwright>=1.40", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["saathi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
